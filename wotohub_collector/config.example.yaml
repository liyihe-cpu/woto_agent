# 首次运行请复制为 config.yaml。登录状态保存在 state/，不要提交该目录。
browser:
  channel: msedge             # 可改为 chrome；留空则使用 Playwright Chromium
  headless: false
  slow_mo_ms: 0
  viewport: { width: 1440, height: 980 }
timing:
  query_delay_ms: 1200
  page_delay_ms: 900
  navigation_timeout_ms: 30000
  retries: 3
filters:
  follower_min: 5000
  follower_max: 10000
  span: 5000           # 初始粉丝跨度：5k 起步，触发 1 万封顶时自动降档(5k->1k->500->250->二分)
  recent_days: 30
  countries: all       # all, or a YAML list: [us, br, jp]
  maximum_count: 10000
# 登录后运行 inspect，真实控件信息会写入此文件的 discovered 区域。
# 可手工补充 selector 覆盖项；只有 inspect 确认后才建议运行 collect。
selectors: {}
